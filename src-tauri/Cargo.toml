[package]
name = "opencode-desktop"
version = "1.0.0"
description = "Opencode Desktop - AI coding assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "opencode_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
strip = false
debug = true
incremental = true

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
